<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16171d" />
    <title>Dickcord</title>
    <style>#boot{position:fixed;inset:0;display:grid;place-items:center;background:#16171d;color:#9aa0b2;font:14px system-ui;text-align:center;padding:24px}</style>
    <script>
      // Если приложение не стартует — показываем причину вместо вечной заставки.
      window.__errs = [];
      window.addEventListener('error', function (e) { window.__errs.push(String(e.message || e.error)); show(); });
      window.addEventListener('unhandledrejection', function (e) { window.__errs.push(String(e.reason)); show(); });
      function show() { var b = document.getElementById('boot'); if (b) b.innerHTML = '<div>Не удалось запустить приложение:<br><br>' + window.__errs.join('<br>') + '</div>'; }
      setTimeout(function () { var b = document.getElementById('boot'); if (b && !window.__errs.length) b.innerHTML = '<div>Приложение не загрузилось.<br>Похоже, в сборку попал исходный код вместо результата <code>npm run build:apk</code>.</div>'; }, 7000);
    </script>
  <style>:root { --bg:#16171d; --bg2:#1d1f27; --bg3:#252833; --line:#2f3340; --text:#e8e9ee; --mute:#9aa0b2; --brand:#7c5cff; --brand2:#5b8cff; --danger:#ff5d6c; --ok:#3ddc97; }
* { box-sizing:border-box; } html,body,#root { height:100%; margin:0; }
body { background:var(--bg); color:var(--text); font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
input,select,textarea,button { font:inherit; color:inherit; } a { cursor:pointer; color:var(--brand2); }
input,select,textarea { width:100%; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px 12px; outline:none; margin:6px 0; transition:border .15s; }
input:focus,select:focus,textarea:focus { border-color:var(--brand); } textarea { min-height:70px; resize:vertical; }
button { background:var(--bg3); border:0; border-radius:8px; padding:8px 14px; cursor:pointer; transition:filter .15s, transform .05s; margin:4px 4px 4px 0; }
button:hover { filter:brightness(1.2); } button:active { transform:scale(.97); }
button.primary { background:linear-gradient(135deg,var(--brand),var(--brand2)); font-weight:600; width:100%; padding:11px; margin-top:10px; }
button.danger { color:var(--danger); } button.icon { background:none; padding:6px 8px; font-size:16px; }
.center { height:100%; display:grid; place-items:center; } .auth-bg { background:radial-gradient(900px 500px at 20% 0%,#2a2250,transparent),radial-gradient(800px 500px at 100% 100%,#1b2e55,transparent),var(--bg); }
.card { background:var(--bg2); border:1px solid var(--line); border-radius:16px; padding:28px; box-shadow:0 20px 60px #0008; animation:pop .2s ease; }
@keyframes pop { from { opacity:0; transform:translateY(8px) scale(.98); } }
.auth { width:min(400px,92vw); } .auth h2 { margin:4px 0 14px; font-size:18px; font-weight:600; text-align:center; }
.brand { margin:0; text-align:center; font-size:30px; background:linear-gradient(135deg,var(--brand),var(--brand2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.links { display:flex; justify-content:space-between; margin-top:14px; } .error { color:var(--danger); margin:6px 0; } .info { color:var(--ok); margin:6px 0; }
.app { display:grid; grid-template-columns:72px 240px 1fr 240px; height:100%; }
.rail { background:#111217; padding:10px 0; display:flex; flex-direction:column; align-items:center; gap:8px; overflow-y:auto; }
.rail-btn { width:48px; height:48px; border-radius:50%; padding:0; margin:0; font-weight:700; overflow:hidden; transition:border-radius .2s, background .2s; background:var(--bg3); }
.rail-btn:hover,.rail-btn.active { border-radius:16px; background:var(--brand); } .rail-btn img { width:100%; height:100%; object-fit:cover; } .rail-btn.add { color:var(--ok); font-size:22px; }
.rail-sep { width:32px; height:2px; background:var(--line); }
.sidebar { background:var(--bg2); display:flex; flex-direction:column; min-height:0; }
.side-head { padding:14px 16px; font-weight:700; border-bottom:1px solid var(--line); }
.channels { flex:1; overflow-y:auto; padding:8px; } .group { color:var(--mute); font-size:11px; text-transform:uppercase; letter-spacing:.06em; padding:14px 8px 6px; display:flex; justify-content:space-between; }
.channel { padding:7px 10px; border-radius:8px; color:var(--mute); cursor:pointer; transition:background .15s; } .channel:hover { background:var(--bg3); color:var(--text); } .channel.active { background:var(--bg3); color:#fff; }
.side-actions { padding:8px; border-top:1px solid var(--line); display:flex; flex-wrap:wrap; }
.me { display:flex; align-items:center; gap:10px; padding:10px; background:#181a21; margin-top:auto; } .me-name { display:flex; flex-direction:column; flex:1; min-width:0; } .me-name small { color:var(--mute); }
.content { display:flex; flex-direction:column; min-width:0; min-height:0; } .topbar { padding:14px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; } .burger { display:none; }
.placeholder { padding:40px; color:var(--mute); max-width:560px; } .placeholder h3 { color:var(--text); }
.members { background:var(--bg2); padding:8px; overflow-y:auto; } .member,.row { display:flex; align-items:center; gap:10px; padding:6px 8px; border-radius:8px; } .member:hover,.row:hover { background:var(--bg3); } .member.off { opacity:.5; }
.mod { margin-left:auto; display:none; gap:6px; } .member:hover .mod { display:flex; } .grow { flex:1; } small { color:var(--mute); }
.avatar { position:relative; flex:none; border-radius:50%; background:linear-gradient(135deg,var(--brand),var(--brand2)); display:grid; place-items:center; font-weight:700; } .avatar img { width:100%; height:100%; border-radius:50%; object-fit:cover; }
.dot { position:absolute; right:-1px; bottom:-1px; width:30%; height:30%; border-radius:50%; border:2px solid var(--bg2); background:#6b7280; } .dot.ONLINE { background:var(--ok); } .dot.IDLE { background:#f5b942; } .dot.DND { background:var(--danger); }
.friends { padding:16px 20px; overflow-y:auto; max-width:760px; } .add-friend { display:flex; gap:8px; } .add-friend button { width:auto; margin-top:6px; }
.overlay { position:fixed; inset:0; background:#000a; display:grid; place-items:center; z-index:50; padding:16px; } .modal { width:min(440px,100%); max-height:90vh; overflow-y:auto; } .modal h2 { margin-top:0; } label { display:block; color:var(--mute); margin-top:8px; }
@media (max-width:900px) { .app { grid-template-columns:64px 1fr; } .members { display:none; } .rail-btn { width:44px; height:44px; }
  .sidebar { display:none; } .app.nav-open .sidebar { display:flex; } .app.nav-open .content { display:none; } .burger { display:block; } }
@media (min-width:901px) and (max-width:1200px) { .app { grid-template-columns:72px 220px 1fr; } .members { display:none; } }
.app { height:100dvh; }
.srv { margin-top:6px; } .srv button { width:100%; margin:4px 0; }
.rail-item { position:relative; } .badge { background:var(--danger); color:#fff; border-radius:10px; padding:0 6px; font-size:11px; font-weight:700; margin-left:auto; min-width:18px; text-align:center; }
.badge.pos { position:absolute; right:-4px; bottom:-2px; border:2px solid #111217; } .udot { position:absolute; left:-6px; top:18px; width:8px; height:8px; background:#fff; border-radius:50%; }
.channel { display:flex; align-items:center; gap:6px; } .channel.unread { color:#fff; font-weight:600; } .dmrow { padding:5px 8px; } .dmname { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.avatar.sm { width:28px; height:28px; font-size:14px; } .pad { padding:6px 10px; display:block; } .pick { max-height:260px; overflow-y:auto; margin:8px 0; }
.chat { display:flex; flex-direction:column; flex:1; min-height:0; position:relative; }
.chat-tools { display:flex; gap:6px; padding:6px 12px; border-bottom:1px solid var(--line); } .chat-tools button { padding:4px 10px; margin:0; font-size:13px; } .chat-tools button.on { background:var(--brand); }
.side-panel { position:absolute; right:0; top:42px; bottom:0; width:min(340px,100%); background:var(--bg2); border-left:1px solid var(--line); z-index:5; padding:12px; overflow-y:auto; } .chk { display:flex; gap:8px; align-items:center; } .chk input { width:auto; margin:0; }
.found { padding:8px; border-radius:8px; background:var(--bg3); margin:8px 0; word-break:break-word; }
.msgs { flex:1; overflow-y:auto; padding:12px 8px; overscroll-behavior:contain; } .hint { color:var(--mute); text-align:center; padding:20px; } .more { display:block; margin:0 auto 8px; }
.msg { display:flex; gap:10px; padding:2px 8px; border-radius:8px; position:relative; } .msg:hover,.msg.sel { background:#ffffff08; } .msg.mentioned { background:#7c5cff1f; box-shadow:inset 3px 0 var(--brand); }
.msg-av { width:38px; flex:none; } .msg-body { min-width:0; flex:1; } .msg-head { display:flex; gap:8px; align-items:baseline; } .msg-text { white-space:pre-wrap; word-break:break-word; }
.mention { background:#7c5cff33; color:#c9bfff; border-radius:4px; padding:0 3px; } .mention.me { background:#ffb02e33; color:#ffd58a; } .edited { font-size:11px; }
.reply-ref { color:var(--mute); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .edit { min-height:44px; }
.actions { position:absolute; right:8px; top:-16px; display:none; background:var(--bg3); border:1px solid var(--line); border-radius:8px; } .msg:hover .actions,.msg.sel .actions { display:flex; } .actions button { background:none; margin:0; padding:4px 8px; }
.reactions { display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; } .chip { padding:2px 8px; margin:0; border:1px solid var(--line); border-radius:12px; font-size:13px; } .chip.on { border-color:var(--brand); background:#7c5cff33; }
.picker { display:flex; flex-wrap:wrap; gap:2px; background:var(--bg3); border:1px solid var(--line); border-radius:10px; padding:6px; margin-top:4px; max-width:300px; } .picker button { background:none; margin:0; padding:4px 6px; font-size:18px; } .picker.comp { margin:0 12px; }
.typing { height:18px; padding:0 16px; color:var(--mute); font-size:12px; } .error.pad { padding:0 16px; }
.reply-bar { padding:6px 16px; background:var(--bg3); color:var(--mute); font-size:12px; display:flex; gap:8px; justify-content:space-between; }
.suggest { margin:0 12px; background:var(--bg3); border:1px solid var(--line); border-radius:10px; overflow:hidden; } .suggest div { display:flex; gap:8px; align-items:center; padding:7px 10px; cursor:pointer; } .suggest div:hover { background:var(--brand); }
.composer { display:flex; align-items:flex-end; gap:6px; padding:8px 12px calc(10px + env(safe-area-inset-bottom)); } .composer textarea { margin:0; max-height:140px; field-sizing:content; } .composer.off { color:var(--mute); justify-content:center; }
.send { background:var(--brand); margin:0; height:42px; width:46px; }
@media (max-width:900px) { .side-panel { top:42px; width:100%; } .actions { top:-20px; } .actions button { padding:8px 10px; } }
/* ---- Голос ---- */
.badge.ok { background:var(--ok); color:#06210f; } .vact { font-size:13px; }
.vusers { padding:0 0 4px 26px; } .vuser { display:flex; align-items:center; gap:6px; padding:2px 6px; color:var(--mute); font-size:13px; }
.vbar { background:#14151b; border-top:1px solid var(--line); padding:8px; } .vbar-info { display:flex; flex-direction:column; cursor:pointer; } .vbar-info .ok { color:var(--ok); } .vbar-info .warn { color:#f5b942; }
.voiceroom { display:flex; flex-direction:column; flex:1; min-height:0; } .vhead { display:flex; justify-content:space-between; align-items:center; padding:8px 16px; border-bottom:1px solid var(--line); }
.vjoin { padding:24px 16px; max-width:480px; } .vlist { margin:10px 0; }
.vgrid { flex:1; overflow-y:auto; padding:12px; display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:10px; align-content:start; } .vstatus { grid-column:1/-1; color:#f5b942; }
.vtile { position:relative; background:var(--bg3); border-radius:14px; aspect-ratio:4/3; overflow:hidden; display:grid; place-items:center; border:2px solid transparent; transition:border-color .12s, box-shadow .12s; }
.vtile.big { grid-column:span 2; aspect-ratio:16/9; } .vtile.speaking { border-color:var(--ok); box-shadow:0 0 14px #3ddc9766; }
.vvideo { width:100%; height:100%; object-fit:cover; background:#000; } .vtile.big .vvideo { object-fit:contain; } .pip { position:absolute; right:8px; top:8px; width:70px; height:52px; border-radius:8px; overflow:hidden; }
.vname { position:absolute; left:8px; bottom:8px; right:8px; background:#000a; padding:2px 8px; border-radius:8px; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.vol { position:absolute; left:8px; right:8px; bottom:36px; width:auto; margin:0; padding:0; opacity:.0; transition:opacity .15s; } .vtile:hover .vol,.vtile:active .vol { opacity:1; } @media (hover:none) { .vol { opacity:.85; } }
.vcontrols { display:flex; justify-content:center; gap:8px; padding:10px; flex-wrap:wrap; } .vcontrols button { width:46px; height:46px; border-radius:50%; padding:0; margin:0; font-size:19px; }
.vcontrols .off { background:var(--danger); } .vcontrols .on { background:var(--brand); } .vcontrols.compact { padding:6px 0 0; gap:6px; justify-content:flex-start; } .vcontrols.compact button { width:38px; height:38px; font-size:16px; }
.vcontrols .ptt { width:auto; border-radius:23px; padding:0 14px; font-size:14px; } .vcontrols button:disabled { opacity:.4; }
.meter { position:relative; height:12px; background:var(--bg); border-radius:6px; overflow:hidden; margin:8px 0; } .meter-fill { height:100%; transition:width .05s; } .meter-th { position:absolute; top:0; bottom:0; width:2px; background:#fff; }
